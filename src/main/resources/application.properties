# Server Configuration
server.port=8080

# Supabase Database Configuration - ADD prepareThreshold=0
# Use environment variables for sensitive data
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/borrowbox?sslmode=disable&prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Supabase API Configuration - Use environment variables
supabase.url=${SUPABASE_URL:https://example.supabase.co}
supabase.anon-key=${SUPABASE_ANON_KEY:your_anon_key_here}
supabase.jwt-secret=${SUPABASE_JWT_SECRET:your_jwt_secret_here}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:your_service_role_key_here}

# JWT Configuration
jwt.secret=${JWT_SECRET:your_very_long_random_secret_key_here_minimum_32_characters}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging
logging.level.com.example.BorrowBoxBackend=DEBUG
logging.level.org.hibernate.SQL=DEBUG